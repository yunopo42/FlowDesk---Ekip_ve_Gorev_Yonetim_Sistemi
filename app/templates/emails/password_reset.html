<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>FlowDesk parola sıfırlama</title>
</head>
<body style="margin:0;background:#f8fafc;font-family:Arial,sans-serif;color:#1e293b;">
    <div style="max-width:600px;margin:0 auto;padding:40px 20px;">
        <div style="background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:32px;">
            <div style="display:inline-block;background:#4f46e5;color:#ffffff;border-radius:10px;padding:10px 14px;font-weight:bold;">FlowDesk</div>
            <h1 style="margin:28px 0 12px;font-size:24px;">Parolanızı yenileyin</h1>
            <p style="line-height:1.7;color:#475569;">Merhaba {{ user.username }}, FlowDesk hesabınız için parola sıfırlama isteği aldık.</p>
            <p style="margin:28px 0;">
                <a href="{{ reset_url }}" style="display:inline-block;background:#4f46e5;color:#ffffff;text-decoration:none;border-radius:10px;padding:14px 22px;font-weight:bold;">Yeni parola oluştur</a>
            </p>
            <p style="line-height:1.7;color:#64748b;font-size:14px;">Bağlantı {{ expires_minutes }} dakika geçerlidir. Bu isteği siz yapmadıysanız e-postayı yok sayabilirsiniz.</p>
        </div>
    </div>
</body>
</html>
