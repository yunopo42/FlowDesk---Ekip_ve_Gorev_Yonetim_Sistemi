{% extends 'base.html' %}

{% block title %}{{ code }} | FlowDesk{% endblock %}

{% block content %}
<section class="mx-auto flex min-h-[60vh] max-w-2xl items-center justify-center">
    <div class="w-full overflow-hidden rounded-3xl border border-slate-200 bg-white text-center shadow-sm">
        <div class="h-2
            {% if color == 'red' %}bg-red-500
            {% elif color == 'amber' %}bg-amber-500
            {% elif color == 'indigo' %}bg-indigo-600
            {% else %}bg-slate-700{% endif %}"></div>

        <div class="p-8 sm:p-12">
            <div class="mx-auto grid h-20 w-20 place-items-center rounded-3xl text-4xl
                {% if color == 'red' %}bg-red-50
                {% elif color == 'amber' %}bg-amber-50
                {% elif color == 'indigo' %}bg-indigo-50
                {% else %}bg-slate-100{% endif %}"
                aria-hidden="true">
                {{ icon }}
            </div>

            <p class="mt-7 text-sm font-bold uppercase tracking-wider
                {% if color == 'red' %}text-red-600
                {% elif color == 'amber' %}text-amber-700
                {% elif color == 'indigo' %}text-indigo-600
                {% else %}text-slate-600{% endif %}">
                {{ code }} · {{ label }}
            </p>
            <h1 class="mt-3 text-3xl font-bold tracking-tight text-slate-950">{{ title }}</h1>
            <p class="mx-auto mt-4 max-w-lg leading-7 text-slate-600">{{ message }}</p>

            <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">
                <button type="button"
                        data-action="history-back"
                        class="rounded-xl border border-slate-300 px-5 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-50">
                    Önceki sayfa
                </button>
                <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.login') }}"
                   class="rounded-xl bg-indigo-600 px-5 py-3 text-sm font-bold text-white transition hover:bg-indigo-700">
                    {{ 'Dashboard’a dön' if current_user.is_authenticated else 'Giriş sayfasına git' }}
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
