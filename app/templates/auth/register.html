{% extends 'base.html' %}
{% block title%} Kayıt Ol | FlowDesk {% endblock %}

{% block content %}
    <h1>Kayıt Ol</h1>
    {% if errors %}
        <div>
            <ul>
                {% for error in errors %}
                    <li>{{error}}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}
    <form method="POST" action="{{url_for('auth.register')}}">
        <div>
            <label for="username">Kullanıcı Adı</label>
            <input 
                type="text"
                id="username"
                name="username"
                value="{{username}}"
                maxlength="50"
                autocomplete="username"
                required>
        </div>
        <div>
            <label for="email">E-Posta Adresi</label>
            <input
                type="email"
                id="email"
                name="email"
                value="{{email}}"
                maxlength="120"
                autocomplete="email"
                required>
        </div>

        <div>
            <label for="password">Parola</label>
            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                autocomplete="new-password"
                required
            >
        </div>

        <div>
            <label for="password_confirm">Parola tekrarı</label>
            <input
                type="password"
                id="password_confirm"
                name="password_confirm"
                minlength="8"
                autocomplete="new-password"
                required
            >
        </div>
        <button type="submit">Kayıt Ol</button>
    </form>
    <p>
        Zaten bir hesabın var mı?
        <a href="{{url_for('auth.login')}}">Giriş yapın</a>
    </p>
{% endblock %}
