{% extends 'base.html' %}

{% block title %}
Giriş Yap | FlowDesk
{% endblock %}

{% block content %}
    <h1>Giriş Yap</h1>

    {% if errors %}
        <div>
            <ul>
                {% for error in errors %}
                    <li>{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.login') }}">
        <div>
            <label for="email">E-posta adresi</label>
            <input
                type="email"
                id="email"
                name="email"
                value="{{ email }}"
                autocomplete="email"
                required
            >
        </div>

        <div>
            <label for="password">Parola</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >
        </div>

        <div>
            <input
                type="checkbox"
                id="remember"
                name="remember"
            >
            <label for="remember">Beni hatırla</label>
        </div>

        <button type="submit">Giriş Yap</button>
    </form>

    <p>
        Henüz bir hesabınız yok mu?
        <a href="{{ url_for('auth.register') }}">Kayıt olun</a>
    </p>
{% endblock %}
